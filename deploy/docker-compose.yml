version: "3.9"

services:
  kiln:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8420:8420"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
